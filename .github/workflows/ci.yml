name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run quickstart
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix sdk/engine/adapters/hookr-case
      - run: npm run test:sdk-cases
      # sdk-offline has no Node dependencies, so the Python -> Node session coverage tests skip there.
      - run: python3 -B -m unittest discover -v -s tests_cases -t tests_cases -p test_session.py
        working-directory: sdk
        env:
          RHOOK_REQUIRE_SESSION_COVERAGE: '1'
  sdk-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -B sdk/tools/test_offline.py
